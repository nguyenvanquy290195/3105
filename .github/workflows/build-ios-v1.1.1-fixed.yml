name: Build 3105 v1.1.1 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout 3105 v1.1.1 from upstream
        uses: actions/checkout@v4
        with:
          repository: YangJiiii/3105
          ref: v1.1.1
          fetch-depth: 1

      - name: Show version
        run: |
          xcodebuild -version
          echo "Git ref:"
          git describe --tags --always
          grep -n "MARKETING_VERSION" ThreeOneOSFive.xcodeproj/project.pbxproj | head

      - name: Build unsigned app
        run: |
          rm -rf build Payload 3105-v1.1.1-unsigned.ipa

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/3105.app" Payload/
          zip -qry "3105-v1.1.1-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-unsigned-ipa
          path: 3105-v1.1.1-unsigned.ipa
